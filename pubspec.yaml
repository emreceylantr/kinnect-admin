name: kinnect_admin
description: "Kinnect admin page"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Backend & Veritabanı ---
  supabase_flutter: ^2.8.0
  timeago: ^3.6.1
  audioplayers: ^6.0.0

  # --- Tasarım & Fontlar ---
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # --- Web Araçları ---
  url_strategy: ^0.3.0      # URL'deki '#' işaretini kaldırır (localhost/#/home yerine localhost/home)
  responsive_builder: ^0.7.1 # Masaüstü ve Tablet uyumu için

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true